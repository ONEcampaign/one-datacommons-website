[project]
name = "dc-search-server"
version = "0.1.0"
description = "DC-Search FastAPI co-process service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai==2.6.0",
    "pydantic>=2.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "uvicorn-worker>=0.2",
    "gunicorn>=23",
    "httpx>=0.28.1",
    "cachetools>=7.0",
    "datacommons-client>=2.1.6",
    "python-dotenv>=1.0",
    "resolvekit[parsing]==0.1.5",
    "country-converter==1.3.2",
    "hdx-python-country==4.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the static demo page (HTML/CSS/JS/fonts) as package data so it is
# available at runtime for the /api/dc-search/demo mount in app.py.
[tool.setuptools.package-data]
dc_search = ["demo/**/*", "resolve_demo/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
