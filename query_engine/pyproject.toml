[project]
name = "qre"
version = "1.0.0"
description = "Query Resolution Engine v1 contract: typed Pydantic models"
requires-python = ">=3.12"
dependencies = [
    # >=2.13 required for pydantic discriminator metadata with union-aliased fields
    # under `from __future__ import annotations` (pydantic PR #12785).
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]
eval = [
    "langfuse>=4.6.1",
    "datacommons-client",
    "httpx",
]
engine = [
    "google-genai>=2.6.0",
    "httpx>=0.28.1",
    "fastapi>=0.115",
    "uvicorn",
    "pydantic>=2.13",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ty.src]
# tests/eval imports conftest via relative import, a pytest convention that
# ty's module resolver can't follow; exclude the subtree to suppress the noise.
# eval_corpus.py is a standalone tooling script (yaml/jsonschema deps live
# outside the declared env); ruff already excludes it, so mirror that here.
exclude = ["tests/eval", "eval_corpus.py"]

[tool.ty.environment]
# Pin ty to the query_engine uv venv (python 3.12 + engine extras).
# Without this, ty also picks up the root .venv (python 3.14) from the
# uvx ty installation cache, producing confusing dual-path resolution.
python = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["eval_corpus.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
